name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The protocol tests drive the Rust transport against `bridge/dev-stub.mjs`, which
      # runs on Node builtins alone - no install step, and no harness checkout.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Unit tests
        run: cargo test --workspace --lib

      # `tests/real_bridge.rs` is deliberately absent: it imports `bridge/lib/server.js`,
      # which only `pnpm run build` produces and which needs a local DSH checkout for its
      # types. Everything that can run from a clean clone runs here.
      - name: Integration tests
        run: cargo test -p dsh-tui --test bridge_protocol --test keys --test render

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
