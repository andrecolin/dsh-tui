[package]
name = "dsh-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Terminal front end for DeepSeek Harness."

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
crossterm = { version = "0.29.0", features = ["event-stream"] }
dsh-tui-proto.workspace = true
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
tokio-stream = "0.1.19"
uuid = { version = "1.26.0", features = ["v4"] }

[dev-dependencies]
serde_json = "1.0.151"
